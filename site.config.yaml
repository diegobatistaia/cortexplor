  # Chave de deploy exclusiva deste projeto (deploy-cortexplor), separada de
  # qualquer outro site hospedado na mesma conta.
  # A CHAVE PRIVADA nunca entra aqui: ela vai em GitHub > Secrets.
  host: 147.79.91.241
  port: 65002
  user: u433721675
  remote_path: /home/u433721675/domains/cortexplor.com/public_html/
  exclude:
    - ".git*"
    - ".claude/"
    - "scripts/"
