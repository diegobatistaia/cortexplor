    - aprendizado de maquina
    - deep learning
    - large language model
    - llm
    - generative ai
    - ia generativa
    - openai
    - anthropic
    - google deepmind
    - claude
    - chatgpt
    - gemini
    - nvidia
    - agentes de ia
    - ai agent
    - modelo de linguagem
    - red neuronal
    - rede neural
    - claude
    - chatgpt
    - gemini
    - llama
    - mistral
    - qwen
    - deepseek
    - grok
    - copilot
    - midjourney
    - sora
    - stable diffusion
