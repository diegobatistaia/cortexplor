# ---------------------------------------------------------------------------
# Cortexplor - configuracao especifica DESTE site.
#
# Tudo que e especifico de nicho, marca, dominio ou idioma mora aqui.
# O codigo em scripts/engine/ e generico: para lancar um site de outro nicho,
# copie o repositorio, troque este arquivo e a Skill de voz. Nada de nicho
# deve ser hardcoded nos scripts.
# ---------------------------------------------------------------------------

site:
  name: Cortexplor
  domain: cortexplor.com
  base_url: https://cortexplor.com
  default_language: pt
  languages: [pt, en, es]
  timezone: America/Sao_Paulo
  # O nome da marca nao comunica o nicho sozinho: a tagline e obrigatoria no
  # header, e o termo de nicho entra em todo title tag (ver seo.title_suffix).
  tagline:
    pt: Notícias e Tendências de IA
    en: AI News & Trends
    es: Noticias y Tendencias de IA
  description:
    pt: Notícias, tendências e números de Inteligência Artificial no Brasil e no mundo.
    en: AI news, trends and numbers from Brazil and around the world.
    es: Noticias, tendencias y números de Inteligencia Artificial en Brasil y el mundo.
  locale:
    pt: pt_BR
    en: en_US
    es: es_ES
  html_lang:
    pt: pt-BR
    en: en
    es: es

niche:
  slug: ai
  # Entra em title/meta/keywords para reforcar o nicho em cada idioma.
  term:
    pt: Inteligência Artificial
    en: Artificial Intelligence
    es: Inteligencia Artificial
  term_short:
    pt: IA
    en: AI
    es: IA

brand:
  ink: "#14130F"
  paper: "#FFFEFB"
  primary: "#3A4556"
  accent: "#6B7A8F"
  surface: "#F7F6F3"
  border: "#E4E2DB"
  muted: "#6B6960"
  # Modo escuro
  ink_dark: "#EDECE8"
  paper_dark: "#14130F"
  primary_dark: "#8A94A6"
  accent_dark: "#B7C0CC"
  surface_dark: "#1C1B18"
  border_dark: "#2E2C28"
  muted_dark: "#9A978D"
  # Tema de quem chega pela primeira vez: light | dark | system (segue o
  # aparelho). O leitor troca no botao do topo e a escolha fica salva no
  # navegador dele.
  default_theme: light
  fonts:
    display: "'Space Grotesk', 'Helvetica Neue', Arial, sans-serif"
    mono: "'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace"
  logo:
    lockup: /assets/logo/cortexplor-logo-color.svg
    lockup_dark: /assets/logo/cortexplor-logo-white.svg
    icon: /assets/logo/cortexplor-icon-color.svg
    favicon_svg: /assets/logo/favicon.svg
    favicon_ico: /assets/logo/favicon.ico

seo:
  title_suffix:
    pt: " | Cortexplor - Notícias de IA"
    en: " | Cortexplor - AI News"
    es: " | Cortexplor - Noticias de IA"
  meta_description_range: [150, 160]
  twitter_site: "@cortexplor"
  organization_type: NewsMediaOrganization

analytics:
  # Preencher depois de criar a propriedade GA4. Vazio = tag nao e renderizada.
  ga4_id: "G-H9FBLT5986"
  search_console_verification: ""
  # Usados só por `run analytics` (roda no GitHub Actions) pra buscar metricas
  # pelas APIs do GA4 e do Search Console. Nao sao segredo - a credencial fica
  # no secret GA_SEARCH_CONSOLE_CREDENTIALS, nunca aqui.
  ga4_property_id: "551989507"
  search_console_site: "https://cortexplor.com/"

ads:
  # enabled: false ate a aprovacao do AdSense. Os slots ficam no HTML como
  # placeholders vazios (nao ocupam espaco) e ligam de uma vez so aqui.
  # client_id pode ser preenchido antes da aprovacao: o Google pede o snippet
  # de verificacao no <head> de todas as paginas antes de revisar o site. O
  # template so exibe anuncios de verdade quando enabled=true (ver base.html).
  enabled: false
  client_id: "ca-pub-2992387596445121"
  slots:
    top_leaderboard: ""
    in_content: ""
    home_between_blocks: ""
    home_sidebar: ""
    footer: ""
  # Criterios para pedir o AdSense. O comando `run status` avalia isso todo dia
  # e avisa quando o site estiver pronto - conteudo fino e o motivo numero um de
  # reprovacao, e reprovar atrasa a proxima tentativa.
  readiness:
    min_posts_per_language: 10
    min_days_live: 21
    max_queue_items: 5
    min_gate_pass_rate: 0.70
  labels:
    pt: Continua após a publicidade
    en: Advertisement
    es: Continúa después de la publicidad

newsletter:
  # DESLIGADA ate existir ferramenta de verdade. Um formulario que aceita o
  # e-mail e nao guarda em lugar nenhum e pior que formulario nenhum: o leitor
  # sai achando que assinou. Para ligar, crie a lista (Beehiiv, Buttondown,
  # Mailchimp), cole o endereco do formulario em `action` e ponha enabled: true.
  enabled: false
  action: ""
  title:
    pt: Receba as novidades de IA por e-mail
    en: Get AI news by email
    es: Recibe las novedades de IA por correo
  text:
    pt: Um resumo do que importa em inteligência artificial, sem ruído e sem hype.
    en: A digest of what actually matters in artificial intelligence - no noise, no hype.
    es: Un resumen de lo que importa en inteligencia artificial, sin ruido y sin hype.

editorial:
  categories:
    - slug: {pt: modelos, en: models, es: modelos}
      label: {pt: "Modelos & Lançamentos", en: "Models & Launches", es: "Modelos y Lanzamientos"}
      color: "#3A4556"
    - slug: {pt: mercado, en: market, es: mercado}
      label: {pt: "Mercado de IA", en: "AI Market", es: "Mercado de IA"}
      color: "#6B7A8F"
    # Editoria regional: existe SO na edicao em portugues. Uma secao sobre o
    # Brasil nao faz sentido para quem le a edicao internacional ou a espanhola
    # - o rotulo traduzido nao resolve, a editoria inteira e que nao pertence
    # aquele publico. Para dar uma editoria regional ao espanhol, crie outra
    # entrada com languages: [es].
    - slug: {pt: brasil}
      label: {pt: "IA no Brasil"}
      color: "#7A5C3E"
      languages: [pt]
    - slug: {pt: aplicacoes, en: applications, es: aplicaciones}
      label: {pt: "Aplicações", en: "Applications", es: "Aplicaciones"}
      color: "#4A6455"
    - slug: {pt: politica, en: policy, es: politica}
      label: {pt: "Regulação", en: "Policy", es: "Regulación"}
      color: "#6B4F5B"
  # Blocos da home, na ordem. O motor renderiza o que existir de conteudo, e
  # cada bloco so recebe materias que ainda nao apareceram acima dele.
  # Disponiveis: today, feed, by_section, hero, most_read, topic_modules,
  # ad_between_blocks, newsletter.
  home_layout:
    - today             # "Hoje em ...": destaque com imagem + manchetes numeradas
    - feed              # linha do tempo | destaques da semana | mais lidas
    - ad_between_blocks
    - by_section        # uma coluna por editoria
    - newsletter
  # Nome do bloco do dia. Fica fixo mesmo quando a ultima materia e de ontem:
  # o "atualizado ha X" ao lado conta a verdade sobre a data.
  today_label:
    pt: Hoje em IA
    en: Today in AI
    es: Hoy en IA
  today_count: 4        # 1 destaque + 3 numeradas
  timeline_count: 7
  highlights_count: 3   # 1 grande + 2 menores
  highlights_days: 7
  # Rotulo dos destaques. Se mudar highlights_days, mude o rotulo junto.
  highlights_label:
    pt: Destaques da semana
    en: This week's highlights
    es: Destacados de la semana
  section_posts: 3      # por coluna em "Por editoria"
  section_columns: 4    # quantas editorias cabem em "Por editoria"
  # Visualizacoes minimas (GA4, ultimos 28 dias) para entrar em "Mais lidas".
  most_read_min_views: 2
  # Para onde vai uma materia cuja editoria nao existe no idioma dela.
  fallback_category: mercado
  most_read_count: 5
  topic_module_count: 4
  related_posts: 3

publishing:
  # Ramp progressivo. O motor le a fase pela data de lancamento e nao publica
  # acima do teto sem estabilidade comprovada no gate (ver quality_gate).
  launch_date: "2026-08-28"   # primeiro deploy do site
  ramp:
    - {from_day: 0,   posts_per_language: 2}
    - {from_day: 28,  posts_per_language: 3}
    # Antecipado pelo dono em 05/10/2026: 4 a partir de 06/10 (dia 39) e 5 a
    # partir de 01/11 (dia 65). Antes: 4 no dia 90 e 5 no dia 150.
    - {from_day: 39,  posts_per_language: 4}
    - {from_day: 65,  posts_per_language: 5}
  # So avanca de fase se a taxa de aprovacao do gate ficar acima disso
  # pelos ultimos `ramp_window_days` dias.
  # Horarios (fuso do site) em que a coleta roda. O teto de cada dia e dividido
  # entre as rodadas que ainda faltam. Se mudar aqui, mude o cron do workflow
  # Coletar e o horario da Routine (30 min depois de cada coleta).
  # Hoje a Routine roda uma vez (coleta 03:30). Para tres rodadas: [7, 12, 18].
  run_hours: [3]
  ramp_gate_pass_rate: 0.80
  ramp_window_days: 14

collection:
  lookback_hours: 48
  # A primaria publica primeiro e a imprensa escreve horas ou um dia depois.
  # Com a mesma janela para as duas, o anuncio original cai fora justamente
  # quando a cobertura esta no auge - foi o que aconteceu com o comunicado da
  # OpenAI sobre o Cursor, de 52h, enquanto a imprensa dele estava com 20h.
  lookback_hours_primary: 120
  max_candidates: 60
  # Overlap minimo de palavras de titulo para juntar dois itens na mesma pauta.
  cluster_threshold: 0.42
  min_title_chars: 25
  # Duas fontes independentes = dois donos diferentes. Veiculos do mesmo grupo
  # contam como UMA fonte (evita "confirmacao" circular por republicacao).
  independence_key: owner
  tavily:
    enabled: false     # ligar depois de configurar o MCP do Tavily
    max_results: 8

sources:
  # Feeds validados em 2026-08-28 (todos responderam com itens). Reuters e AP
  # fecharam o RSS publico: para ter agencia de noticia tier 1 na checagem
  # cruzada e preciso contratar a API delas - ver SETUP.md.
  #
  # O que importa aqui e a diversidade de OWNERS, nao o numero de feeds: a
  # regra das duas fontes conta grupos, e um fato so vira materia se dois
  # grupos diferentes o afirmarem. Genbeta e Xataka sao ambos Webedia; Wired
  # e Ars Technica sao ambos Conde Nast - por isso dividem o mesmo owner.
  rss:

    # ---- FONTES PRIMARIAS ----------------------------------------------
    # Quem faz a noticia, nao quem a noticia. Um lancamento de modelo, um
    # resultado trimestral ou um relatorio de incidente nascem aqui; a
    # imprensa depois escreve sobre. Citar o veiculo que leu o anuncio no
    # lugar do anuncio e citar o intermediario.
    #
    # kind: primary muda duas coisas - a pauta e liderada por elas na coleta,
    # e o gate exige que a materia cite a primaria quando ela existe.
    #
    # Atencao aos donos: DeepMind, blog.google e research.google sao todos
    # Alphabet; Microsoft Research e Microsoft Source sao a mesma empresa;
    # AWS e Amazon Science idem. Tres feeds do mesmo dono continuam sendo
    # UMA fonte para a regra das duas.
    - {name: OpenAI, url: "https://openai.com/news/rss.xml", lang: en, owner: openai, tier: 1, kind: primary}
    - {name: Google DeepMind, url: "https://deepmind.google/blog/rss.xml", lang: en, owner: alphabet, tier: 1, kind: primary}
    - {name: Google AI, url: "https://blog.google/technology/ai/rss/", lang: en, owner: alphabet, tier: 1, kind: primary}
    - {name: Google Research, url: "https://research.google/blog/rss/", lang: en, owner: alphabet, tier: 1, kind: primary}
    - {name: Hugging Face, url: "https://huggingface.co/blog/feed.xml", lang: en, owner: huggingface, tier: 1, kind: primary}
    - {name: NVIDIA, url: "https://blogs.nvidia.com/feed/", lang: en, owner: nvidia, tier: 1, kind: primary}
    - {name: Microsoft Research, url: "https://www.microsoft.com/en-us/research/feed/", lang: en, owner: microsoft, tier: 1, kind: primary}
    - {name: Microsoft Source, url: "https://news.microsoft.com/source/feed/", lang: en, owner: microsoft, tier: 1, kind: primary}
    - {name: Apple Machine Learning, url: "https://machinelearning.apple.com/rss.xml", lang: en, owner: apple, tier: 1, kind: primary}
    - {name: AWS Machine Learning, url: "https://aws.amazon.com/blogs/machine-learning/feed/", lang: en, owner: amazon, tier: 1, kind: primary}
    - {name: Amazon Science, url: "https://www.amazon.science/index.rss", lang: en, owner: amazon, tier: 1, kind: primary}
    - {name: Meta Newsroom, url: "https://about.fb.com/news/feed/", lang: en, owner: meta, tier: 1, kind: primary}
    - {name: Qwen (Alibaba), url: "https://qwenlm.github.io/blog/index.xml", lang: en, owner: alibaba, tier: 1, kind: primary}
    - {name: Together AI, url: "https://www.together.ai/blog/rss.xml", lang: en, owner: togetherai, tier: 1, kind: primary}
    - {name: Roboflow, url: "https://blog.roboflow.com/rss/", lang: en, owner: roboflow, tier: 2, kind: primary}

    # Sem RSS publico, checado em 2026-08-28: Anthropic, Mistral, xAI, Cohere,
    # DeepSeek, Perplexity, Stability, ElevenLabs, Runway. Todas devolvem HTML.
    # Enquanto isso, anuncios dessas empresas chegam pela imprensa - o que
    # significa que a materia cita o veiculo, nao o anuncio. Vale revisitar.

    # ---- IMPRENSA -------------------------------------------------------
    - {name: TechCrunch AI, url: "https://techcrunch.com/category/artificial-intelligence/feed/", lang: en, owner: techcrunch, tier: 2}
    - {name: MIT Technology Review AI, url: "https://www.technologyreview.com/topic/artificial-intelligence/feed", lang: en, owner: mit-tr, tier: 1}
    - {name: VentureBeat AI, url: "https://venturebeat.com/category/ai/feed/", lang: en, owner: venturebeat, tier: 2}
    - {name: The Verge AI, url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml", lang: en, owner: vox-media, tier: 2}
    - {name: Wired AI, url: "https://www.wired.com/feed/tag/ai/latest/rss", lang: en, owner: conde-nast, tier: 2}
    - {name: Ars Technica, url: "https://feeds.arstechnica.com/arstechnica/technology-lab", lang: en, owner: conde-nast, tier: 2}
    - {name: ZDNet AI, url: "https://www.zdnet.com/topic/artificial-intelligence/rss.xml", lang: en, owner: ziff-davis, tier: 2}
    - {name: The Register AI, url: "https://www.theregister.com/software/ai_ml/headlines.atom", lang: en, owner: situation-publishing, tier: 2}
    - {name: Olhar Digital IA, url: "https://olhardigital.com.br/editorias/inteligencia-artificial/feed/", lang: pt, owner: olhar-digital, tier: 2}
    - {name: Tecmundo, url: "https://rss.tecmundo.com.br/feed", lang: pt, owner: nzn, tier: 2}
    - {name: Canaltech, url: "https://canaltech.com.br/rss/", lang: pt, owner: canaltech, tier: 2}
    - {name: Xataka, url: "https://www.xataka.com/feedburner.xml", lang: es, owner: webedia, tier: 2}
    - {name: Hipertextual, url: "https://hipertextual.com/feed", lang: es, owner: hipertextual, tier: 2}
    - {name: El País Tecnología, url: "https://feeds.elpais.com/mrss-s/pages/ep/site/elpais.com/section/tecnologia/portada", lang: es, owner: prisa, tier: 1}
    - {name: Engadget, url: "https://www.engadget.com/rss.xml", lang: en, owner: yahoo, tier: 2}
    - {name: CNBC Technology, url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=19854910", lang: en, owner: nbcuniversal, tier: 1}
    - {name: Axios, url: "https://api.axios.com/feed/", lang: en, owner: axios, tier: 1}
    - {name: The Guardian Technology, url: "https://www.theguardian.com/uk/technology/rss", lang: en, owner: guardian, tier: 1}
    - {name: TechRadar, url: "https://www.techradar.com/feeds/articletype/news", lang: en, owner: future-plc, tier: 2}
    - {name: SiliconANGLE, url: "https://siliconangle.com/feed/", lang: en, owner: siliconangle, tier: 2}
    - {name: Business Insider, url: "https://feeds.businessinsider.com/custom/all", lang: en, owner: axel-springer, tier: 2}
    - {name: Fortune, url: "https://fortune.com/feed/", lang: en, owner: fortune, tier: 1}
    - {name: Mobile Time, url: "https://www.mobiletime.com.br/feed/", lang: pt, owner: mobiletime, tier: 2}
    - {name: Convergencia Digital, url: "https://www.convergenciadigital.com.br/rss/", lang: pt, owner: convergencia, tier: 2}
    - {name: Startupi, url: "https://startupi.com.br/feed/", lang: pt, owner: startupi, tier: 2}
    - {name: Genbeta, url: "https://www.genbeta.com/feedburner.xml", lang: es, owner: webedia, tier: 2}
    - {name: Computer Hoy, url: "https://computerhoy.20minutos.es/rss", lang: es, owner: henneo, tier: 2}
    - {name: El Confidencial Tecnologia, url: "https://rss.elconfidencial.com/tecnologia/", lang: es, owner: elconfidencial, tier: 1}
    - {name: Xataka Mexico, url: "https://www.xataka.com.mx/feedburner.xml", lang: es, owner: webedia, tier: 2}

