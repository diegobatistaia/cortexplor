<div class="topbar">
  <div class="wrap topbar-inner">
    <p class="topbar-date"><time data-today hidden></time></p>
    <div class="topbar-tools">
      <nav class="lang-switch" aria-label="{{ t.language }}">
        {%- for link in lang_links %}
        <a href="{{ link.url }}" hreflang="{{ link.hreflang }}" lang="{{ link.hreflang }}" title="{{ link.name }}"{% if link.current %} aria-current="true"{% endif %}>{{ link.code }}<span class="visually-hidden"> ({{ link.name }})</span></a>
        {%- endfor %}
      </nav>
      <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false" aria-label="{{ t.dark_theme }}" title="{{ t.dark_theme }}" hidden>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</div>
<header class="site-header">
  <div class="wrap masthead">
    <a class="brand" href="/{{ lang }}/" aria-label="{{ cfg.get('site.name') }}">
      <img class="brand-mark light" src="{{ cfg.get('brand.logo.lockup') }}" alt="{{ cfg.get('site.name') }}" width="190" height="44">
      <img class="brand-mark dark" src="{{ cfg.get('brand.logo.lockup_dark') }}" alt="" aria-hidden="true" width="190" height="44">
    </a>
    <p class="tagline">{{ cfg.localized('site.tagline', lang) }}</p>
  </div>
  <nav class="nav" aria-label="{{ t.sections }}">
    <div class="wrap nav-inner">
      <a href="/{{ lang }}/"{% if is_home %} aria-current="page"{% endif %}>{{ t.home }}</a>
      {%- for cat in categories %}
      <a href="/{{ lang }}/c/{{ cat.slug }}/" style="--kicker:{{ cat.color }}"{% if cat.key == active_category %} aria-current="page"{% endif %}>{{ cat.label }}</a>
      {%- endfor %}
    </div>
  </nav>
</header>
