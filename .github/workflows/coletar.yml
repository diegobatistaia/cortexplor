name: Coletar

# A Routine que escreve as matérias roda num sandbox sem saída para a web: só
# PyPI e as APIs da Anthropic passam pelo proxy. Nenhum feed de notícia é
# alcançável de lá.
#
# Então a coleta acontece aqui, onde há internet, e o resultado chega até a
# Routine pelo próprio repositório: este workflow commita data/briefing.json e a
# Routine lê o arquivo depois de clonar.
#
# Roda 30 minutos antes de cada rodada da Routine, para dar folga se um feed
# estiver lento. HOJE a Routine roda uma vez por dia (~04:00), entao a coleta
# tambem. Para passar a tres rodadas, mude a Routine em claude.ai/code/routines
# (07:30, 12:30, 18:30) e troque o cron abaixo pelos tres comentados, e
# publishing.run_hours no site.config.yaml para [7, 12, 18]. Os tres tem que
# andar juntos: coleta sem Routine nao publica nada, e Routine sem coleta do dia
# cai em "briefing de outro dia".
on:
  schedule:
    - cron: "30 6 * * *"   # 03:30 America/Sao_Paulo
    # - cron: "0 10 * * *"   # 07:00
    # - cron: "0 15 * * *"   # 12:00
    # - cron: "0 21 * * *"   # 18:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coletar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Coletar as pautas do dia
        run: python -m scripts.pipeline.run brief

      - name: Commitar o briefing
        run: |
          git config user.name "cortexplor-bot"
          git config user.email "bot@cortexplor.com"
          git add data/briefing.json
          if git diff --cached --quiet; then
            echo "Briefing inalterado."
          else
            git commit -m "briefing: coleta de $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Resumo
        if: always()
        run: python -m scripts.pipeline.run briefing >> "$GITHUB_STEP_SUMMARY" || true
