name: teste-imagens-tmp
on:
  push:
    branches: [teste-imagens-tmp]
permissions:
  contents: write
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: mkdir -p teste-saida && python -m scripts.tmp.teste_imagens > teste-saida/log.txt 2>&1 || true
      - run: |
          git config user.name tmp && git config user.email tmp@tmp
          git add -f teste-saida && git commit -m "tmp: resultado [skip ci]" && git push
