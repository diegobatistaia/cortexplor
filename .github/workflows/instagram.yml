name: Instagram

# Publica no Instagram só o carrossel que o dono aprovou. Quem pede é a sessão
# do Claude, gravando social/publicar/pedido.json no branch instagram (ver
# scripts/social/publicar.py). Vive só no branch instagram; nada disso vai ao main.
on:
  push:
    branches: [instagram]
    paths:
      - "social/publicar/pedido.json"

permissions:
  contents: write

concurrency:
  group: instagram-publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instagram

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publicar
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: python scripts/social/publicar.py executar

      - name: Registrar resultado na fila
        if: always()
        run: |
          git config user.name "cortexplor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social/fila.json social/publicar/ultimo.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "instagram: resultado da publicação"
          for i in 1 2 3 4; do
            git pull --rebase origin instagram && git push origin HEAD:instagram && exit 0
            sleep $((i * 4))
          done
          exit 1
