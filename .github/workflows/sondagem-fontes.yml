name: Sondagem fontes (temporário)
on:
  push:
    branches: [fontes-oficiais]
jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: |
          python - <<'PY'
          from scripts.engine.config import load
          from scripts.engine.collect import fetch_listing, run
          cfg = load()
          for s in [s for s in cfg.get("sources.rss") if s.get("type") == "html"]:
              its = fetch_listing(s)
              print(f"== {s['name']}: {len(its)} itens")
              for i in sorted(its, key=lambda i: i["published_at"], reverse=True)[:5]:
                  print("   ", i["published_at"][:10], i["title"][:80], i["url"])
          print()
          cl = run(cfg, include_seen=True)
          ok = [c for c in cl if c["owner_count"] >= 2]
          so = [c for c in cl if c["owner_count"] < 2 and c.get("primary_owners")]
          print(f"{len(cl)} pautas; {len(ok)} com 2+ fontes; {len(so)} só com anúncio oficial")
          for c in so[:15]:
              print("  1P", c["primary_owners"], c["title"][:80])
          PY
      - run: python -m scripts.tools.selfcheck | tail -3
